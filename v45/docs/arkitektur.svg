<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <marker id="pil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="pilblock" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .rubrik { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .liten  { font-size: 11px; fill: #475569; }
      .box    { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .sub    { font-size: 11px; fill: #334155; }
      .port   { font-size: 10.5px; font-weight: 600; fill: #1e3a5f; }
      .linje  { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#pil); }
    </style>
  </defs>

  <!-- Region -->
  <rect x="170" y="18" width="815" height="530" rx="10" fill="#fafafa" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="185" y="40" class="rubrik">AWS eu-north-1 (Stockholm)</text>

  <!-- VPC -->
  <rect x="190" y="55" width="565" height="478" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="205" y="76" class="rubrik" fill="#4c1d95">VPC novatrix-vpc · 10.0.0.0/16 (från v44)</text>

  <!-- Publika subnat -->
  <rect x="210" y="92" width="260" height="150" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="222" y="111" class="liten">Publikt webbsubnät · 10.0.1.0/24 · AZ a</text>
  <rect x="235" y="128" width="210" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="340" y="158" text-anchor="middle" class="box">EC2 novatrix-web-v45</text>
  <text x="340" y="177" text-anchor="middle" class="sub">Apache · PHP · WordPress</text>
  <text x="340" y="194" text-anchor="middle" class="sub">roll novatrix-web-role · IMDSv2</text>

  <rect x="485" y="92" width="255" height="150" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="497" y="111" class="liten">Publikt mgmt-subnät · 10.0.2.0/24 · AZ a</text>
  <rect x="510" y="128" width="205" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="612" y="162" text-anchor="middle" class="box">Bastion</text>
  <text x="612" y="181" text-anchor="middle" class="sub">enda vägen in för SSH</text>

  <!-- Privata subnat -->
  <rect x="210" y="340" width="260" height="175" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="222" y="507" class="liten">Privat subnät · 10.0.11.0/24 · AZ a</text>
  <rect x="235" y="385" width="210" height="80" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="340" y="418" text-anchor="middle" class="box">EFS mount target</text>
  <text x="340" y="437" text-anchor="middle" class="sub">wp-content · krypterad</text>

  <rect x="485" y="340" width="255" height="175" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="497" y="507" class="liten">Privat subnät · 10.0.12.0/24 · AZ b</text>
  <rect x="510" y="368" width="205" height="68" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="612" y="400" text-anchor="middle" class="box">RDS MariaDB 11.4</text>
  <text x="612" y="419" text-anchor="middle" class="sub">db.t3.micro · ej publik · krypterad</text>
  <rect x="510" y="448" width="205" height="38" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.1"/>
  <text x="612" y="471" text-anchor="middle" class="sub">EFS mount target (AZ b)</text>

  <!-- Regionala tjanster -->
  <rect x="775" y="110" width="195" height="250" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="787" y="130" class="liten">Regionala tjänster (HTTPS 443)</text>
  <rect x="790" y="145" width="165" height="92" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="872" y="172" text-anchor="middle" class="box">S3 novatrix-backup</text>
  <text x="872" y="191" text-anchor="middle" class="sub">backup/ · mysqldump 02:00</text>
  <text x="872" y="208" text-anchor="middle" class="sub">raderas efter 14 dagar</text>
  <text x="872" y="225" text-anchor="middle" class="sub">privat · bara HTTPS</text>
  <rect x="790" y="255" width="165" height="88" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="872" y="285" text-anchor="middle" class="box">Secrets Manager</text>
  <text x="872" y="304" text-anchor="middle" class="sub">DB-lösenord</text>
  <text x="872" y="321" text-anchor="middle" class="sub">läses av webbrollen</text>

  <!-- Externa -->
  <rect x="15" y="130" width="135" height="64" rx="8" fill="#ffffff" stroke="#0f172a"/>
  <text x="82" y="157" text-anchor="middle" class="box">Besökare</text>
  <text x="82" y="175" text-anchor="middle" class="sub">internet</text>
  <rect x="15" y="262" width="135" height="64" rx="8" fill="#ffffff" stroke="#0f172a"/>
  <text x="82" y="289" text-anchor="middle" class="box">Min dator</text>
  <text x="82" y="307" text-anchor="middle" class="sub">admin-IP</text>

  <!-- Pilar -->
  <path class="linje" d="M150,162 L233,162"/>
  <text x="160" y="152" class="port">HTTP/HTTPS</text>

  <path class="linje" d="M150,294 L612,294 L612,218"/>
  <text x="330" y="287" class="port">SSH 22 (bara admin-IP)</text>

  <path class="linje" d="M510,190 L447,190"/>
  <text x="458" y="183" class="port">SSH 22</text>

  <path class="linje" d="M300,216 L300,383"/>
  <text x="308" y="328" class="port">NFS 2049 (TLS)</text>

  <path class="linje" d="M405,216 L560,370"/>
  <text x="532" y="326" class="port">MariaDB 3306</text>

  <path class="linje" d="M438,128 L438,86 L760,86 L760,190 L788,190"/>
  <text x="600" y="80" class="port">HTTPS 443</text>
  <path class="linje" d="M760,190 L760,299 L788,299"/>


  <!-- Teckenforklaring -->
  <text x="185" y="572" class="liten">db-sg och efs-sg släpper bara in web-sg · privata subnät saknar väg till internet · NACL per subnät · bastion och databas når inte internet</text>
</svg>
