AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Novatrix natverkslager (v44 som kod, med EFS fran v45). Stack: <prefix>-natverk.
  VPC, publika och privata subnat, routing, NACL:er, security groups och
  VPC Flow Logs. Exporterar ID:n som data- och webbstacken laser med !ImportValue.

# =============================================================
# Lager 1 av 3: natverk -> data -> webb. Byggs forst, rivs sist.
#
# Skydd i flera lager (samma tanke som v44):
#   1. Subnat och routing  - bara publika subnat har vag till internet
#   2. NACL per subnat     - grovt filter, stateless, kan neka
#   3. Security groups     - fint filter, stateful, pekar pa varandra:
#        min IP -> bastion -> webb -> databas/EFS
#   4. VPC Flow Logs       - visar vad som slapps igenom och blockeras
#
# Allt som varierar ar parametrar. Subnatens adresser raknas ut fran
# VpcCidr med !Cidr, sa en andra miljo behover bara ett nytt prefix
# och (om man vill) ett nytt VpcCidr.
#
# VARFOR MITT EGET NAT I STALLET FOR STARTPAKETETS SKELETT
# Startpaketets natverk.yaml har ett publikt subnat dar webbservern
# tar emot SSH direkt fran min IP, en NACL for det publika subnatet
# och fri utgaende trafik. Jag har behallit skelettets struktur
# (stacknamn, Prefix, MyIp, exportnamnen som data- och webbstacken
# importerar) men fyllt den med natet jag byggde i v44, eftersom
# uppgiften ar att gora MIN stack till kod och VG-kravet ar
# sakerhet i flera lager:
#   - Bastion i ett eget mgmt-subnat. Webbservern exponerar aldrig
#     port 22 mot internet, SSH gar bara via bastion (ProxyJump).
#   - En NACL per subnat (webb, mgmt, privat) i stallet for en.
#   - Begransad utgaende trafik: webben far bara 443 ut, plus
#     databasen och EFS. Databasen, EFS och bastion far inte na
#     internet alls.
#   - VPC Flow Logs, sa att jag kan visa vad som slapps igenom
#     och vad som blockeras.
# Skillnad i adresser: skelettet har privata subnat 10.0.2.0/24 och
# 10.0.4.0/24. Hos mig ar 10.0.2.0/24 mgmt-subnatet, sa de privata
# ligger kvar pa 10.0.11.0/24 och 10.0.12.0/24 som i v44.
# =============================================================

Parameters:
  Prefix:
    Type: String
    Default: novatrix
    AllowedPattern: "[a-z][a-z0-9-]*"
    Description: Namnprefix for alla resurser och exports, t.ex. novatrix eller novatrix-test
  MyIp:
    Type: String
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/32"
    Description: Publik adress till DIN dator, den enda som far SSH:a till bastion, t.ex. 203.0.113.10/32
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "(\\d{1,3}\\.){3}\\d{1,3}/16"
    Description: VPC:ts adressomrade, maste vara ett /16
  DbPort:
    Type: Number
    Default: 3306
    Description: Databasens port (3306 MariaDB/MySQL)
  FlowLogDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14, 30]

Resources:
  # ---------------------------------------------------------
  # VPC och internet gateway
  # ---------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true    # kravs for EFS och RDS DNS-namn inne i VPC:t
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------
  # Subnat. !Cidr delar VPC:t i /24-block:
  #   block 1  -> publikt webbsubnat    (10.0.1.0/24)
  #   block 2  -> publikt mgmt-subnat   (10.0.2.0/24), bastion
  #   block 11 -> privat subnat AZ a    (10.0.11.0/24), RDS och EFS
  #   block 12 -> privat subnat AZ b    (10.0.12.0/24), RDS kraver tva AZ
  # ---------------------------------------------------------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-public-web" }, { Key: Niva, Value: publik }]

  MgmtSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-public-mgmt" }, { Key: Niva, Value: publik }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-a" }, { Key: Niva, Value: privat }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [12, !Cidr [!Ref VpcCidr, 16, 8]]
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-b" }, { Key: Niva, Value: privat }]

  # ---------------------------------------------------------
  # Routing: publika subnat har vag till internet, privata inte
  # ---------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-public-rt" }]

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet, RouteTableId: !Ref PublicRouteTable }

  MgmtSubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref MgmtSubnet, RouteTableId: !Ref PublicRouteTable }

  # Egen route table utan internetvag, kopplad explicit, sa att en route
  # som laggs till i VPC:ns main route table inte paverkar databasen.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-rt" }]

  PrivateSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  # ---------------------------------------------------------
  # NACL:er (stateless). Svarstrafik maste tillatas separat:
  #   - svar TILL klienter pa internet: 1024-65535 (klientens port)
  #   - svar till VARA Linux-servrar:   32768-65535 (Linux ephemeral)
  # Allt som inte matchar en regel nekas av den inbyggda regeln *.
  # ---------------------------------------------------------
  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-public-nacl" }]

  NaclInHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: 0.0.0.0/0, PortRange: { From: 80, To: 80 } }
  NaclInHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }
  NaclInSshFranMgmt:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 120, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: !GetAtt MgmtSubnet.CidrBlock, PortRange: { From: 22, To: 22 } }
  NaclInSvar:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 130, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: 0.0.0.0/0, PortRange: { From: 32768, To: 65535 } }
  # Ut: svar till klienter, och vara egna anslutningar till databas (DbPort)
  # och EFS (2049), som ryms i 1024-65535. Security groupen stoppar att
  # webbservern sjalv oppnar anslutningar ut pa hoga portar.
  NaclOutSvar:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true,
                  CidrBlock: 0.0.0.0/0, PortRange: { From: 1024, To: 65535 } }
  NaclOutHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PublicNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true,
                  CidrBlock: 0.0.0.0/0, PortRange: { From: 443, To: 443 } }

  PublicSubnetNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PublicSubnet, NetworkAclId: !Ref PublicNacl }

  MgmtNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-mgmt-nacl" }]

  MgmtNaclInSshMinIp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref MgmtNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: !Ref MyIp, PortRange: { From: 22, To: 22 } }
  MgmtNaclInSvarFranWebb:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref MgmtNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: !GetAtt PublicSubnet.CidrBlock, PortRange: { From: 32768, To: 65535 } }
  MgmtNaclOutSvarMinIp:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref MgmtNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true,
                  CidrBlock: !Ref MyIp, PortRange: { From: 1024, To: 65535 } }
  MgmtNaclOutSshTillWebb:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref MgmtNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: true,
                  CidrBlock: !GetAtt PublicSubnet.CidrBlock, PortRange: { From: 22, To: 22 } }

  MgmtSubnetNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref MgmtSubnet, NetworkAclId: !Ref MgmtNacl }

  # De privata subnaten: bara webbsubnatet, bara databas och EFS
  PrivateNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-private-nacl" }]

  PrivateNaclInDb:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: !GetAtt PublicSubnet.CidrBlock, PortRange: { From: !Ref DbPort, To: !Ref DbPort } }
  PrivateNaclInEfs:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateNacl, RuleNumber: 110, Protocol: 6, RuleAction: allow, Egress: false,
                  CidrBlock: !GetAtt PublicSubnet.CidrBlock, PortRange: { From: 2049, To: 2049 } }
  PrivateNaclOutSvar:
    Type: AWS::EC2::NetworkAclEntry
    Properties: { NetworkAclId: !Ref PrivateNacl, RuleNumber: 100, Protocol: 6, RuleAction: allow, Egress: true,
                  CidrBlock: !GetAtt PublicSubnet.CidrBlock, PortRange: { From: 32768, To: 65535 } }

  PrivateSubnetANacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, NetworkAclId: !Ref PrivateNacl }
  PrivateSubnetBNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, NetworkAclId: !Ref PrivateNacl }

  # ---------------------------------------------------------
  # Security groups (stateful). Kedjan:
  #   min IP -> bastion -> webb -> databas och EFS
  # Standardregeln "all utgaende trafik" ersatts overallt.
  # Regler som pekar bakat i kedjan ar egna resurser for att
  # undvika cirkelberoenden mellan grupperna.
  # ---------------------------------------------------------
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Prefix}-bastion-sg"
      GroupDescription: "Bastion: SSH in bara fran min IP, SSH ut bara till webbservern"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref MyIp, Description: SSH fran min IP }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, DestinationSecurityGroupId: !Ref WebSecurityGroup, Description: SSH till webbservern }
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-bastion-sg" }]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Prefix}-web-sg"
      GroupDescription: "Webb: HTTP/HTTPS fran alla, SSH bara fran bastion"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "HTTPS ut: dnf, WordPress, S3, Secrets Manager" }
        - { IpProtocol: tcp, FromPort: !Ref DbPort, ToPort: !Ref DbPort, DestinationSecurityGroupId: !Ref DbSecurityGroup, Description: Till databasen }
        - { IpProtocol: tcp, FromPort: 2049, ToPort: 2049, DestinationSecurityGroupId: !Ref EfsSecurityGroup, Description: Till EFS }
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-web-sg" }]

  WebSshFranBastion:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref BastionSecurityGroup
      Description: SSH bara fran bastion

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Prefix}-db-sg"
      GroupDescription: "Databas: bara fran webbservern, ingen utgaende trafik"
      VpcId: !Ref Vpc
      # En regel mot 127.0.0.1/32 tar bort standardregeln och slapper inget ut
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: Ingen utgaende trafik }
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-db-sg" }]

  DbFranWebb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref WebSecurityGroup
      Description: Bara fran webbservern

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Prefix}-efs-sg"
      GroupDescription: "EFS: NFS 2049 bara fran webbservern, ingen utgaende trafik"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: Ingen utgaende trafik }
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-efs-sg" }]

  EfsFranWebb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EfsSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref WebSecurityGroup
      Description: NFS bara fran webbservern

  # ---------------------------------------------------------
  # VPC Flow Logs -> CloudWatch Logs (ACCEPT och REJECT)
  # ---------------------------------------------------------
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${Prefix}/flowlogs"
      RetentionInDays: !Ref FlowLogDays

  # Least privilege: rollen far bara skriva till just den har loggruppen
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: skriv-flowlogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-flowlog-role" }]

  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref Vpc
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 60
      Tags: [{ Key: Name, Value: !Sub "${Prefix}-flowlog" }]

# Exports laser de andra stackarna med !ImportValue. Sa lange en export
# anvands gar natverksstacken inte att radera, darfor rivs den sist.
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${Prefix}-vpc-id" }
  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export: { Name: !Sub "${Prefix}-public-subnet-id" }
  MgmtSubnetId:
    Value: !Ref MgmtSubnet
    Export: { Name: !Sub "${Prefix}-mgmt-subnet-id" }
  PrivateSubnetAId:
    Value: !Ref PrivateSubnetA
    Export: { Name: !Sub "${Prefix}-private-a-id" }
  PrivateSubnetBId:
    Value: !Ref PrivateSubnetB
    Export: { Name: !Sub "${Prefix}-private-b-id" }
  WebSecurityGroupId:
    Value: !Ref WebSecurityGroup
    Export: { Name: !Sub "${Prefix}-web-sg-id" }
  BastionSecurityGroupId:
    Value: !Ref BastionSecurityGroup
    Export: { Name: !Sub "${Prefix}-bastion-sg-id" }
  DbSecurityGroupId:
    Value: !Ref DbSecurityGroup
    Export: { Name: !Sub "${Prefix}-db-sg-id" }
  EfsSecurityGroupId:
    Value: !Ref EfsSecurityGroup
    Export: { Name: !Sub "${Prefix}-efs-sg-id" }
  DbPort:
    Value: !Ref DbPort
    Export: { Name: !Sub "${Prefix}-db-port" }
  # Utan export, bara for verify.sh
  PublicNaclId:        { Value: !Ref PublicNacl }
  MgmtNaclId:          { Value: !Ref MgmtNacl }
  PrivateNaclId:       { Value: !Ref PrivateNacl }
  PrivateRouteTableId: { Value: !Ref PrivateRouteTable }
  MyIp:                { Value: !Ref MyIp }
  FlowLogGroup:        { Value: !Ref FlowLogGroup }
